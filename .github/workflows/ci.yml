name: Project Docs Check

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'README.md'
      - 'INTERVIEW.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'README.md'
      - 'INTERVIEW.md'
      - 'CHANGELOG.md'
      - 'docs/**'

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required docs
        run: |
          test -f README.md
          test -f INTERVIEW.md
          test -f CHANGELOG.md
          test -f docs/技术总结.md
